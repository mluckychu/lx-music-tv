name: Build LxMusicTV APK

# 把本工程（package.json / android/ / .github/ 等）直接作为 GitHub 仓库根目录，
# 推送到 main/master 分支，或手动在 Actions 页面点 “Run workflow”，
# 即可自动编译并在 Artifacts 中下载 app-release.apk。

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;25.1.8937393"

      - name: Install JS dependencies
        run: npm install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-tv-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
